name: "Bug"
description: "Signaler un comportement incorrect ou une régression."
title: "BUG: "
labels: ["type:bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: "Description"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Étapes pour reproduire"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Comportement attendu"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Comportement observé"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "Environnement"
    validations:
      required: false
